<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Beautiful Girl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--midnight:#101D38;--royal:#253F70;--soft:#FAFAFF;--powder:#DCEAFF;--gold:#D8BD8A;--lav:#E9E2F5;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--midnight);color:var(--soft);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
section{position:relative;padding:clamp(4.5rem,12vw,9rem) 1.5rem}
.wrap{max-width:62rem;margin:0 auto}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.1s ease,transform 1.1s ease}
.rv.in{opacity:1;transform:none}

/* HERO */
#hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
background:radial-gradient(ellipse at 50% 85%,#2a4a86 0,transparent 60%),radial-gradient(ellipse at 20% 10%,#1b2f5c 0,transparent 55%),var(--midnight)}
#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.balloon{position:absolute;bottom:-18vh;width:clamp(46px,9vw,80px);aspect-ratio:.82;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),transparent 30%),var(--c);opacity:.85;animation:rise var(--d) linear var(--l) infinite;pointer-events:none}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:clamp(60px,14vw,110px);background:linear-gradient(rgba(216,189,138,.7),transparent)}
@keyframes rise{from{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(18px,-65vh) rotate(4deg)}to{transform:translate(-10px,-135vh) rotate(-3deg)}}
.hero-in{position:relative;z-index:2;max-width:46rem}
.cake{width:clamp(130px,30vw,190px);margin:0 auto 1rem;filter:drop-shadow(0 0 30px rgba(216,189,138,.35))}
.flame{transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite alternate}
.flame:nth-of-type(2){animation-delay:.3s}.flame:nth-of-type(3){animation-delay:.6s}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.85,1.2) rotate(3deg)}}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.3rem,9vw,5.2rem);line-height:1.02;letter-spacing:-.01em}
h1 .l{display:inline-block;opacity:0;transform:translateY(.6em) rotate(4deg);animation:lt .9s cubic-bezier(.2,.8,.2,1) forwards}
h1 .gold{color:var(--gold);font-style:italic}
@keyframes lt{to{opacity:1;transform:none}}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,3.6vw,1.6rem);color:var(--powder);margin:1.6rem auto 2.4rem;max-width:34rem;opacity:0;animation:lt 1.2s 2.6s forwards}
.cta{position:relative;padding:1.05rem 2.2rem;border:1px solid var(--gold);border-radius:999px;background:linear-gradient(135deg,rgba(216,189,138,.22),rgba(216,189,138,.06));
color:var(--soft);letter-spacing:.06em;font-size:1rem;opacity:0;animation:lt 1.2s 3.1s forwards,glow 3s 4.6s infinite;transition:transform .4s,background .4s}
.cta:hover{transform:translateY(-3px);background:var(--gold);color:var(--midnight)}
@keyframes glow{50%{box-shadow:0 0 34px rgba(216,189,138,.45)}}
#veil{position:fixed;inset:0;z-index:50;background:var(--midnight);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .8s}
#veil.on{opacity:1;pointer-events:all}
#veil span{font-family:var(--serif);font-style:italic;font-size:2rem;color:var(--gold)}
#story{display:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* MESSAGE */
#msg{background:linear-gradient(var(--midnight),#14264a)}
#msg .wrap{display:grid;gap:2.5rem;max-width:44rem}
#msg h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(2rem,7vw,3.4rem);color:var(--gold);line-height:1.15}
#msg p{font-family:var(--serif);font-size:clamp(1.25rem,3.8vw,1.55rem);line-height:1.7;color:var(--powder)}
#msg p:first-of-type::first-letter{float:left;font-size:4.4em;line-height:.8;padding:.08em .12em 0 0;color:var(--gold);font-style:italic}

/* GALLERY */
#photos{background:var(--soft);color:var(--midnight)}
#photos h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,7vw,3.6rem);line-height:1.1;margin-bottom:.6rem}
#photos .cap{color:var(--royal);margin-bottom:3rem;max-width:30rem}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(.7rem,2.5vw,1.6rem);align-items:start}
.ph{margin:0;padding:0;border:0;background:none;text-align:left;position:relative}
.ph{display:block;width:100%}.ph .fr{display:block;width:100%;position:relative;overflow:hidden;border-radius:999px 999px 14px 14px;aspect-ratio:3/4;background:linear-gradient(160deg,var(--powder),var(--lav));
box-shadow:0 20px 50px -20px rgba(16,29,56,.45);clip-path:inset(0 0 100% 0);transition:clip-path 1.4s cubic-bezier(.2,.8,.2,1)}
.ph.in .fr{clip-path:inset(0)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transition:transform 1.2s}
.ph:hover img{transform:scale(1.05)}
.ph .miss{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:1rem;font-family:var(--serif);font-style:italic;color:var(--royal);font-size:1.05rem;line-height:1.3}
.ph.missing .miss{display:grid}.ph.missing img{display:none}
.ph small{display:block;margin-top:.7rem;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--royal)}
.p1{grid-column:1/5}.p1 .fr{aspect-ratio:4/5}
.ph:only-child{grid-column:2/6;margin:0 auto;width:100%}@media(max-width:560px){.ph:only-child{grid-column:1/7}}.p2{grid-column:5/7;margin-top:30%}.p3{grid-column:1/4;margin-top:-4%}.p4{grid-column:4/7;margin-top:12%}.p4 .fr{border-radius:14px 14px 999px 999px}
.p2 .fr,.p3 .fr{border-radius:14px}.p3 .fr{border-radius:999px}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--gold),transparent 70%);opacity:.35;animation:fl 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes fl{to{transform:translateY(-22px)}}
#lb{border:0;padding:0;background:transparent;max-width:92vw;max-height:88vh;color:var(--soft)}
#lb::backdrop{background:rgba(10,18,36,.92)}
#lb img{max-width:92vw;max-height:80vh;border-radius:14px;display:block;margin:0 auto}
#lb p{text-align:center;font-family:var(--serif);font-style:italic;font-size:1.3rem;margin-top:.8rem}
#lb button{display:block;margin:.8rem auto 0;background:none;border:1px solid var(--gold);border-radius:999px;padding:.4rem 1.4rem}

/* QUALITIES */
#quals{background:radial-gradient(ellipse at 80% 20%,#2a2150 0,transparent 55%),#16244a;overflow:hidden}
.q{display:block;width:100%;background:none;border:0;border-bottom:1px solid rgba(216,189,138,.25);padding:1.2rem 0;text-align:left}
.q b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(2.1rem,9vw,4.6rem);line-height:1.05;color:var(--lav);transition:color .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.q:nth-child(even) b{transform:translateX(clamp(1rem,12vw,9rem))}
.q:hover b,.q[aria-expanded=true] b{color:var(--gold)}
.q span{display:block;max-height:0;overflow:hidden;opacity:0;font-size:1.05rem;color:var(--powder);max-width:28rem;transition:max-height .7s,opacity .7s,margin .7s}
.q:nth-child(even) span{margin-left:clamp(1rem,12vw,9rem)}
.q[aria-expanded=true] span{max-height:9rem;opacity:1;margin-top:.7rem}
#quals h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--powder);margin-bottom:1.5rem;opacity:.8}

/* WISHES */
#wishes{background:linear-gradient(var(--powder),var(--lav));color:var(--midnight);min-height:90vh;min-height:90svh;display:grid;place-items:center;text-align:center;overflow:hidden}
#wishes::before{content:"";position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,rgba(216,189,138,.5),transparent 65%);animation:fl 6s ease-in-out infinite alternate}
.wb{position:relative;max-width:40rem}
#wt{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,7.5vw,3.6rem);line-height:1.2;min-height:6.5em;display:grid;place-items:center;transition:opacity .8s,transform .8s}
#wt.out{opacity:0;transform:translateY(14px) scale(.98)}
.dots{display:flex;gap:.6rem;justify-content:center;margin-top:1.5rem}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--royal);background:none;padding:0;transition:.4s}
.dots button[aria-current=true]{background:var(--royal);transform:scale(1.4)}
.nx{margin-top:1.6rem;background:none;border:1px solid var(--royal);color:var(--royal);border-radius:999px;padding:.6rem 1.6rem}
.star{position:absolute;color:var(--gold);animation:tw 3s ease-in-out infinite alternate;font-size:1.1rem}
@keyframes tw{from{opacity:.2}to{opacity:1;transform:scale(1.3)}}

/* ENVELOPE */
#end{background:radial-gradient(ellipse at 50% 100%,#2d4d8a 0,transparent 60%),var(--midnight);text-align:center;padding-bottom:7rem}
#end h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(1.7rem,6vw,2.6rem);margin-bottom:.5rem}
#end .hint{color:var(--powder);margin-bottom:2.5rem}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;margin:0 auto;background:none;border:0;perspective:900px;transition:transform .5s,opacity .8s}
.env:hover{transform:translateY(-5px) rotate(-1deg)}
.env .bk,.env .ft,.env .fp{position:absolute;inset:0;border-radius:8px}
.env .bk{background:#c9ad78}
.env .ft{background:linear-gradient(135deg,#e6d2a8,var(--gold));clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:3}
.env .fp{background:#efdcb2;clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:top;transition:transform .9s,z-index 0s .45s;z-index:4;backface-visibility:visible}
.env .seal{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:5;width:44px;height:44px;border-radius:50%;background:var(--royal);display:grid;place-items:center;color:var(--gold);transition:opacity .4s}
.env.open .fp{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0}
.env.done{opacity:.0;height:0;aspect-ratio:auto;margin:0;pointer-events:none}
.letter{max-width:36rem;margin:0 auto;padding:clamp(2rem,7vw,3.5rem) clamp(1.4rem,6vw,3rem);background:var(--soft);color:var(--midnight);border-radius:6px;text-align:left;
box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:none;position:relative}
.letter.show{display:block;animation:up 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(60px) scale(.96)}}
.letter p{font-family:var(--serif);font-size:clamp(1.2rem,3.8vw,1.4rem);line-height:1.65;margin-bottom:1.1em;opacity:0;animation:lt 1s forwards}
.letter .hb{font-weight:500;font-size:clamp(1.5rem,5vw,2rem);color:var(--royal);margin-top:1.6rem}
.letter .cl{font-style:italic;color:#5a6a8c}
.heart{display:none;width:70px;margin:3rem auto 0}
.heart.show{display:block;animation:beat 1.8s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}

#mus{position:fixed;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));z-index:40;width:48px;height:48px;border-radius:50%;
background:rgba(16,29,56,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--gold);color:var(--gold);display:none}
#mus[aria-pressed=true]{box-shadow:0 0 0 0 rgba(216,189,138,.6);animation:glow 2s infinite}
#toast{position:fixed;left:50%;bottom:5rem;translate:-50% 0;background:var(--soft);color:var(--midnight);padding:.6rem 1.2rem;border-radius:999px;z-index:70;opacity:0;transition:opacity .4s;pointer-events:none;font-size:.95rem}
#toast.on{opacity:1}
@media(max-width:560px){.p2{margin-top:22%}.q:nth-child(even) b{transform:translateX(1rem)}.q:nth-child(even) span{margin-left:1rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html{scroll-behavior:auto}.rv{opacity:1;transform:none}h1 .l,.sub,.cta{opacity:1;transform:none}.ph .fr{clip-path:none}}
</style>
</head>

  <canvas id="sparks" aria-hidden="true"></canvas>
  <div id="balloons" aria-hidden="true"></div>
  <div class="hero-in">
    <svg class="cake" viewBox="0 0 200 190" aria-hidden="true">
      <ellipse cx="100" cy="176" rx="90" ry="8" fill="#0a1328" opacity=".5"/>
      <rect x="20" y="124" width="160" height="48" rx="10" fill="#253F70"/><path d="M20 140q10 12 20 0t20 0 20 0 20 0 20 0 20 0 20 0 20 0v-8H20z" fill="#FAFAFF"/>
      <rect x="45" y="84" width="110" height="42" rx="9" fill="#E9E2F5"/><path d="M45 98q9 11 18 0t18 0 18 0 18 0 18 0 17 0v-8H45z" fill="#D8BD8A"/>

      <g fill="#FFE9B0"><path class="flame" d="M84.5 14c5 6 4 11 0 14-4-3-5-8 0-14z"/><path class="flame" d="M99.5 10c5 6 4 11 0 14-4-3-5-8 0-14z"/><path class="flame" d="M114.5 14c5 6 4 11 0 14-4-3-5-8 0-14z"/></g>

<script>
const $=s=>document.querySelector(s),C=CONFIG,RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
Object.entries(C.colors).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v));
const HL=C.headline.filter(w=>w!=="\n").join(" ");document.title=HL;
// Hero text
const seg=s=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(s)].map(x=>x.segment):[...s];
let n=0;$("#h1").innerHTML=C.headline.map((w,i)=>w==="\n"?"<br>":`<span style="display:inline-block;white-space:nowrap">${seg(w).map(ch=>`<span class="l ${w.toLowerCase()===C.name.toLowerCase()?"gold":""}" aria-hidden="true" style="animation-delay:${(.3+(n++)*.05).toFixed(2)}s">${ch}</span>`).join("")}</span> `).join("");
$("#h1").setAttribute("aria-label",HL);$("#sub").textContent=C.heroText;$("#open").textContent=C.buttonText;
// Balloons
const cols=["rgba(220,234,255,.8)","rgba(233,226,245,.8)","rgba(216,189,138,.85)","rgba(88,124,196,.85)"];
$("#balloons").innerHTML=Array.from({length:9},(_,i)=>`<i class="balloon" style="left:${5+i*11}%;--c:${cols[i%4]};--d:${14+i%4*3}s;--l:-${i*2.3}s"></i>`).join("");
// Sparkle particles
function sparks(){const c=$("#sparks"),x=c.getContext("2d");let w,h,p=[];
 const rs=()=>{w=c.width=c.offsetWidth;h=c.height=c.offsetHeight;p=Array.from({length:Math.min(60,w/10|0)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,s:Math.random()*.3+.1,t:Math.random()*6}))};rs();addEventListener("resize",rs);
 (function f(){x.clearRect(0,0,w,h);p.forEach(q=>{q.y-=q.s;q.t+=.03;if(q.y<-5)q.y=h+5;x.globalAlpha=.3+.5*Math.abs(Math.sin(q.t));x.fillStyle="#D8BD8A";x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()});if(!RM)requestAnimationFrame(f)})()}
sparks();
// Confetti
function confetti(ox,oy){const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cl=["#D8BD8A","#DCEAFF","#E9E2F5","#FAFAFF","#6f93d6"];
 const p=Array.from({length:RM?0:130},()=>({x:ox,y:oy,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,g:.28,r:Math.random()*6+3,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cl[Math.random()*5|0],life:1}));
 (function f(){x.clearRect(0,0,c.width,c.height);let alive=0;p.forEach(q=>{q.vy+=q.g;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.a+=q.va;q.life-=.006;if(q.life>0&&q.y<c.height+20){alive++;x.save();x.globalAlpha=Math.max(q.life,0);x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-q.r,-q.r/2,q.r*2,q.r);x.restore()}});if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
// Open surprise
$("#open").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();confetti(r.left+r.width/2,r.top);
 setTimeout(()=>{$("#veil").classList.add("on")},700);
 setTimeout(()=>{$("#story").style.display="block";$("#msg").scrollIntoView({behavior:"instant"});watch();$("#veil").classList.remove("on");confetti(innerWidth/2,innerHeight*.9)},1700)};
// Message
$("#mt").textContent=C.messageTitle;$("#mp").innerHTML=C.message.map(t=>`<p class="rv">${t}</p>`).join("");
// Gallery
$("#pt").textContent=C.photosTitle;$("#pc").textContent=C.photosCaption;
$("#gal").innerHTML=C.photos.slice(0,4).map((p,i)=>`<button class="ph p${i+1}" data-i="${i}" aria-label="Open photo: ${p.caption}"><span class="fr"><img src="${p.src}" alt="${p.caption}"><span class="miss">Place ${p.src.replace(/</g,"")} here</span></span><small>${p.caption}</small></button>`).join("");
const EXTS=["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP","gif","avif","jfif","heic"];
let pending=Math.min(C.photos.length,4);
function relayout(){document.querySelectorAll(".ph.missing").forEach(b=>b.remove());const ok=[...document.querySelectorAll(".ph")];
 if(!ok.length){$("#gal").innerHTML='<p style="grid-column:1/-1;color:#253F70">Put your photos in the same folder as this page: '+C.photos.map(p=>p.src).join(", ")+'</p>';return}
 ok.forEach((b,i)=>{b.classList.remove("p1","p2","p3","p4");b.classList.add("p"+(i+1))})}
const settle=()=>{if(--pending===0)relayout()};
document.querySelectorAll(".ph img").forEach(im=>{const first=im.getAttribute("src"),base=first.replace(/\.[a-z0-9]+$/i,""),tried=[first];let k=0;
 im.onload=settle;
 im.onerror=()=>{if(first.startsWith("data:")){im.closest(".ph").classList.add("missing");settle();return}let next=null;while(k<EXTS.length){const c=base+"."+EXTS[k++];if(!tried.includes(c)){next=c;break}}
  if(next){tried.push(next);im.src=next}else{im.closest(".ph").classList.add("missing");settle()}}});
document.querySelectorAll(".ph").forEach(b=>b.onclick=()=>{const p=C.photos[b.dataset.i],lb=$("#lb");$("#lbi").style.display=b.classList.contains("missing")?"none":"block";$("#lbi").src=b.querySelector("img").src;$("#lbi").alt=p.caption;$("#lbc").textContent=b.classList.contains("missing")?p.src+" is not added yet":p.caption;lb.showModal?lb.showModal():lb.setAttribute("open","")});
$("#lbx").onclick=()=>$("#lb").close();$("#lb").onclick=e=>{if(e.target.id==="lb")e.target.close()};
// Qualities
$("#ql").innerHTML=C.qualities.map(q=>`<button class="q rv" aria-expanded="false"><b>${q.t}</b><span>${q.m}</span></button>`).join("");
document.querySelectorAll(".q").forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")==="true";document.querySelectorAll(".q").forEach(x=>x.setAttribute("aria-expanded","false"));b.setAttribute("aria-expanded",String(!o))});
// Wishes
let wi=0,wtimer;const wt=$("#wt");
$("#dots").innerHTML=C.wishes.map((_,i)=>`<button aria-label="Wish ${i+1}" data-i="${i}"></button>`).join("");
$("#wishes .wb").insertAdjacentHTML("beforebegin",[[8,18],[88,28],[14,78],[82,70],[50,8]].map(([l,t],i)=>`<span class="star" aria-hidden="true" style="left:${l}%;top:${t}%;animation-delay:${i*.7}s">✦</span>`).join(""));
function showWish(i,instant){wi=(i+C.wishes.length)%C.wishes.length;const set=()=>{wt.textContent=C.wishes[wi];wt.classList.remove("out");document.querySelectorAll("#dots button").forEach((d,k)=>d.setAttribute("aria-current",k===wi))};
 if(instant){set();return}wt.classList.add("out");setTimeout(set,RM?0:700)}
function auto(){clearInterval(wtimer);if(!RM)wtimer=setInterval(()=>showWish(wi+1),5500)}
$("#nx").onclick=()=>{showWish(wi+1);auto()};document.querySelectorAll("#dots button").forEach(d=>d.onclick=()=>{showWish(+d.dataset.i);auto()});
showWish(0,true);auto();
// Envelope + letter
$("#et").textContent=C.envelopeTitle;$("#eh").textContent=C.envelopeHint;
$("#letter").innerHTML=C.letter.map((t,i)=>`<p style="animation-delay:${1+i*.9}s">${t}</p>`).join("")+`<p class="hb" style="animation-delay:${1+C.letter.length*.9}s">${C.finalLine}</p><p class="cl" style="animation-delay:${2+C.letter.length*.9}s">${C.closingLine}</p>`;
$("#env").onclick=e=>{const b=e.currentTarget;if(b.classList.contains("open"))return;b.classList.add("open");const r=b.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2);
 setTimeout(()=>{b.classList.add("done");$("#letter").classList.add("show");$("#letter").scrollIntoView({behavior:RM?"auto":"smooth",block:"center"})},1100);
 setTimeout(()=>{$("#heart").classList.add("show");burst()},1100+(C.letter.length+2)*900)};
function burst(){const h=$("#heart").getBoundingClientRect();confetti(h.left+h.width/2,h.top)}
// Reveal on scroll
function watch(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
 document.querySelectorAll(".rv,.ph").forEach((el,i)=>{el.style.transitionDelay=el.classList.contains("ph")?(i%4*.12)+"s":"";io.observe(el)})}
// Music
const aud=$("#aud"),mus=$("#mus");
if(C.music){aud.src=C.music;mus.style.display="block";
 mus.onclick=()=>{const on=mus.getAttribute("aria-pressed")==="true";if(on){aud.pause();mus.setAttribute("aria-pressed","false");mus.setAttribute("aria-label","Play music")}
  else aud.play().then(()=>{mus.setAttribute("aria-pressed","true");mus.setAttribute("aria-label","Pause music")}).catch(()=>{const t=$("#toast");t.textContent="Music file not found";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)})}}
</script>
</body>
</html>
